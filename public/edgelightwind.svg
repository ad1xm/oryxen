<svg
  width="256"
  height="256"
  viewBox="0 0 256 256"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#5B00FF"/>
    </linearGradient>

    <filter id="neonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="spotlightTech" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="256" height="256" rx="32" ry="32" fill="url(#bgGradient)"/>

  <!-- Outer decorative ring -->
  <circle
    cx="128"
    cy="128"
    r="100"
    fill="none"
    stroke="#1A3A4D"
    stroke-width="1"
    opacity="0.5"
  />

  <!-- Main gradient ring -->
  <circle
    cx="128"
    cy="128"
    r="72"
    fill="none"
    stroke="url(#techGradient)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- Secondary ring for depth -->
  <circle
    cx="128"
    cy="128"
    r="72"
    fill="none"
    stroke="url(#techGradient)"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.15"
    style="filter: blur(6px);"
  />

  <!-- Inner accent ring -->
  <circle
    cx="128"
    cy="128"
    r="48"
    fill="none"
    stroke="url(#techGradient)"
    stroke-width="1.5"
    opacity="0.4"
  />

  <!-- Spotlight reflection -->
  <circle
    cx="128"
    cy="128"
    r="72"
    fill="url(#spotlightTech)"
  />

  <!-- Center dot -->
  <circle
    cx="128"
    cy="128"
    r="6"
    fill="url(#techGradient)"
    opacity="0.8"
  />

  <!-- Minimalist crosshair (camera focus) -->
  <g stroke="url(#techGradient)" stroke-width="1" opacity="0.5" stroke-linecap="round">
    <line x1="118" y1="128" x2="108" y2="128"/>
    <line x1="148" y1="128" x2="138" y2="128"/>
    <line x1="128" y1="118" x2="128" y2="108"/>
    <line x1="128" y1="148" x2="128" y2="138"/>
  </g>

  <!-- Geometric corner accents with smooth curves -->
  <!-- Top-Left Corner -->
  <g stroke="url(#techGradient)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 70 80 Q 70 70 80 70 L 85 70" fill="none"/>
    <path d="M 70 80 L 70 85" fill="none"/>
  </g>

  <!-- Top-Right Corner -->
  <g stroke="url(#techGradient)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 186 70 Q 196 70 196 80 L 196 85" fill="none"/>
    <path d="M 171 70 L 186 70" fill="none"/>
  </g>

  <!-- Bottom-Left Corner -->
  <g stroke="url(#techGradient)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 70 171 L 70 186 Q 70 196 80 196 L 85 196" fill="none"/>
    <path d="M 70 186 L 70 186" fill="none"/>
  </g>

  <!-- Bottom-Right Corner -->
  <g stroke="url(#techGradient)" stroke-width="1.5" opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 186 196 Q 196 196 196 186 L 196 171" fill="none"/>
    <path d="M 171 196 L 186 196" fill="none"/>
  </g>
</svg>